name: Capture actual TkForge desktop screenshot

on:
  push:
    paths:
      - tools/capture_demo.py
      - .github/workflows/capture-demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
          python -m pip install pillow
      - name: Capture screenshot from real Tkinter UI
        run: xvfb-run -a python -m tools.capture_demo
      - uses: actions/upload-artifact@v4
        with:
          name: tkforge-real-screenshot
          path: docs/screenshot.png
          retention-days: 30
